# CampusOverflow 持续集成流水线（对应 arc42 第 10 章适应度函数与第 7 章部署视图）
# 渐进式质量门禁（ADR-009）：按 Sprint 范围逐步扩大必须通过的测试集合
name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

# Sprint 3 起不再按 Sprint 范围缩小测试集合（ADR-009：门禁转为全量阻断），
# 原先的 SPRINT_MODULES 变量已删除，单元测试与覆盖率阶段恢复全量执行。

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # 阶段 1：编译（模块依赖不成环由 Maven 保证）
      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      # 阶段 2：单元测试（S3 起全量：领域层 + 应用层，毫秒级，无外部依赖）
      - name: 单元测试（全量）
        run: mvn -B -f backend/pom.xml test

      # 阶段 3：架构适应度函数（ArchUnit：FF-1~FF-6，始终全量）
      # -am 构建兄弟模块依赖；failIfNoSpecifiedTests=false 允许依赖模块无 ArchitectureTest
      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -am -Dtest=ArchitectureTest -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      # 阶段 4：领域层覆盖率门禁（S3 起全量，低于 0.70 直接失败）
      - name: 覆盖率门禁（全量）
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false

      # 阶段 5：集成测试（Testcontainers 拉起真实 MySQL + Redis，S3 起为硬门禁）
      - name: 集成测试
        run: mvn -B -f backend/pom.xml verify -Dsurefire.skip=true

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          # Surefire 结果 + JaCoCo 覆盖率页面（HTML 与 XML），评审可直接查看
          path: |
            **/target/*-reports/*.xml
            **/target/site/jacoco/**
          if-no-files-found: ignore

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 构建
        working-directory: frontend
        run: npm run build

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .

  # Sprint 4 / PB-46：把"一键部署可用"变成可验证的门禁，而不是发布说明里的口头承诺。
  # 只在 main 的 push 上跑（PR 阶段由 backend / frontend / images 三个 job 负责），
  # 避免把每次 PR 都拖慢一个完整的镜像构建周期。
  deploy:
    name: 一键部署冒烟（compose 起全栈）
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: 校验编排文件
        run: docker compose -f deploy/docker-compose.yml config > /dev/null

      - name: 一键部署（含演示数据 profile）
        run: docker compose -f deploy/docker-compose.yml up -d --build

      - name: 等待后端就绪
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null 2>&1; then
              echo "backend readiness OK after $((i*5))s"
              curl -fsS http://localhost:8080/actuator/health/readiness
              exit 0
            fi
            sleep 5
          done
          echo "backend 探活 60 次仍未就绪"
          exit 1

      - name: 探活前端与演示数据
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost/)
          echo "web HTTP $code"
          test "$code" = "200"
          count=$(curl -fsS 'http://localhost:8080/api/v1/questions?page=0&size=20' \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d.get("content", d) if isinstance(d, dict) else d))')
          echo "questions = $count"
          test "$count" -ge 3

      - name: 服务状态
        if: always()
        run: docker compose -f deploy/docker-compose.yml ps

      - name: 失败时导出容器日志
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail=300

      - name: 清理
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
