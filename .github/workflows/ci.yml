# CampusOverflow 持续集成流水线（对应 arc42 第 10 章适应度函数与第 7 章部署视图）
# 渐进式质量门禁（ADR-009）：按 Sprint 范围逐步扩大必须通过的测试集合
name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

env:
  # 每个 Sprint 计划会后由质量负责人（E）更新（逗号分隔的模块路径）
  # S0: co-shared-kernel,co-identity/co-identity-domain
  # S1: 追加 co-qa/co-qa-domain,co-qa/co-qa-application
  # S2: 追加 co-reputation/co-reputation-domain,co-reputation/co-reputation-application
  # S3: 删除本变量，恢复全量 mvn test / verify
  SPRINT_MODULES: co-shared-kernel,co-identity/co-identity-domain

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # 阶段 1：编译（模块依赖不成环由 Maven 保证）
      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      # 阶段 2：单元测试（Sprint 范围，领域层 + 应用层，毫秒级，无外部依赖）
      - name: 单元测试（Sprint 范围）
        run: mvn -B -f backend/pom.xml test -pl "$SPRINT_MODULES" -am

      # 阶段 3：架构适应度函数（ArchUnit：FF-1~FF-6，始终全量）
      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -Dtest=ArchitectureTest -DfailIfNoTests=false

      # 阶段 4：领域层覆盖率门禁（Sprint 范围，低于阈值直接失败）
      - name: 覆盖率门禁（Sprint 范围）
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false -pl "$SPRINT_MODULES" -am

      # 阶段 5：集成测试（Testcontainers 拉起真实 MySQL + Redis；S3 前允许失败）
      - name: 集成测试
        run: mvn -B -f backend/pom.xml verify -Dsurefire.skip=true
        continue-on-error: true   # S3 移除此行，集成测试成为硬门禁

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/target/*-reports/*.xml"

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 构建
        working-directory: frontend
        run: npm run build

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .
