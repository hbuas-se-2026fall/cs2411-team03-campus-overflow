# CampusOverflow 持续集成流水线（对应 arc42 第 10 章适应度函数与第 7 章部署视图）
# 渐进式质量门禁（ADR-009）：按 Sprint 范围逐步扩大必须通过的测试集合
name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

# Sprint 3 起不再按 Sprint 范围缩小测试集合（ADR-009：门禁转为全量阻断），
# 原先的 SPRINT_MODULES 变量已删除，单元测试与覆盖率阶段恢复全量执行。

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # 阶段 1：编译（模块依赖不成环由 Maven 保证）
      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      # 阶段 2：单元测试（S3 起全量：领域层 + 应用层，毫秒级，无外部依赖）
      - name: 单元测试（全量）
        run: mvn -B -f backend/pom.xml test

      # 阶段 3：架构适应度函数（ArchUnit：FF-1~FF-6，始终全量）
      # -am 构建兄弟模块依赖；failIfNoSpecifiedTests=false 允许依赖模块无 ArchitectureTest
      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -am -Dtest=ArchitectureTest -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      # 阶段 4：领域层覆盖率门禁（S3 起全量，低于 0.70 直接失败）
      - name: 覆盖率门禁（全量）
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false

      # 阶段 5：集成测试（Testcontainers 拉起真实 MySQL + Redis，S3 起为硬门禁）
      - name: 集成测试
        run: mvn -B -f backend/pom.xml verify -Dsurefire.skip=true

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/target/*-reports/*.xml"

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 构建
        working-directory: frontend
        run: npm run build

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .
